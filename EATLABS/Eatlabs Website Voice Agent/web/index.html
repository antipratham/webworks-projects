<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EatLabs site agent — test console</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --line: #e4e0da; --ink: #1c1a17; --soft: #6b6560;
    --accent: #b8422e; --accent-soft: #fdf2ef; --ok: #2f6f4e; --warn: #9a6a1b; --warn-bg: #fdf6e7;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614; --panel: #201e1b; --line: #332f2b; --ink: #f0ece6; --soft: #a39b92;
      --accent: #e8755c; --accent-soft: #2b1d19; --ok: #6cc294; --warn: #d9a740; --warn-bg: #2a2317;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171614; --panel: #201e1b; --line: #332f2b; --ink: #f0ece6; --soft: #a39b92;
    --accent: #e8755c; --accent-soft: #2b1d19; --ok: #6cc294; --warn: #d9a740; --warn-bg: #2a2317;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--soft); font-size: 13px; }
  .status { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--soft);
            border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px;
            background: var(--panel); margin: 14px 0 18px; }
  .status b { color: var(--ink); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--soft); margin-right: 5px; }
  .dot.live { background: var(--ok); }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  select, button, input, textarea {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
  .primary:hover:not(:disabled) { filter: brightness(1.07); }

  /* The speaker control. Armed before a question, audio follows the text as it arrives;
     pressed on a finished answer, it reads that answer back. One icon, both jobs. */
  .icon { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
          padding: 7px 11px; line-height: 1; }
  .icon svg { width: 17px; height: 17px; display: block; }
  .icon .lbl { font-size: 12.5px; color: var(--soft); }
  .icon[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .icon[aria-pressed="true"] .lbl { color: var(--accent); }
  .icon.busy svg { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  form { display: flex; gap: 8px; }
  form input { flex: 1; min-width: 0; }

  /* Recording has to be unmistakable. Nothing else on the page is red and moving, and
     the ring keeps growing with the sound so the tester can see the mic is live before
     they have spoken a whole sentence into a dead one. */
  .mic[data-state="recording"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mic[data-state="recording"] .lbl { color: #fff; font-variant-numeric: tabular-nums; }
  .mic[data-state="recording"] .ico { position: relative; }
  .mic[data-state="recording"] .ico::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid currentColor; opacity: .55;
    transform: scale(calc(1 + var(--level, 0) * 0.9));
    transition: transform .08s linear;
  }
  .mic[data-state="working"] svg { animation: pulse 1.1s ease-in-out infinite; }
  .hint { font-size: 12.5px; color: var(--soft); margin-top: 7px; }
  .hint.bad { color: var(--warn); }

  .turn { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
          padding: 16px; margin-bottom: 14px; }
  .q { font-weight: 600; margin: 0 0 10px; }
  .q::before { content: "Q"; display: inline-block; width: 19px; height: 19px; line-height: 19px;
               text-align: center; font-size: 11px; border-radius: 50%; background: var(--accent-soft);
               color: var(--accent); margin-right: 8px; vertical-align: 1px; }
  .a { margin: 0; font-size: 16px; min-height: 1.5em; }
  .a .pending { color: var(--soft); }
  /* A sentence that has been cleared and spoken, fading in as it lands. */
  .a .sent { animation: land .32s ease-out; }
  @keyframes land { from { opacity: .35; } to { opacity: 1; } }

  .meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
          margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line);
          font-size: 12px; color: var(--soft); }

  .flag { background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn);
          border-radius: 8px; padding: 9px 11px; margin-top: 11px; font-size: 13px; }
  .flag b { display: block; margin-bottom: 2px; }
  .flag .said { color: var(--soft); font-style: italic; margin-top: 5px; display: block; }

  /* Not a warning. An answer written with no passages behind it is a deliberate mode,
     and the tester needs to see which of the two they are looking at. */
  .note { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 11px;
          margin-top: 11px; font-size: 12.5px; color: var(--soft); }

  details { margin-top: 11px; font-size: 13px; }
  summary { cursor: pointer; color: var(--soft); }
  .psg { border-left: 2px solid var(--line); padding: 2px 0 2px 11px; margin: 9px 0; }
  .psg .h { font-weight: 550; }
  .psg .id { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--soft); }
  .pill { display: inline-block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
          border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-left: 6px; color: var(--soft); }
  .pill.high { border-color: var(--warn); color: var(--warn); }
  .pill.provided { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--soft); text-align: center; padding: 34px 0; font-size: 14px; }
  @media (max-width: 560px) { form { flex-direction: column; } .wrap { padding-top: 18px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EatLabs site agent</h1>
    <span class="sub">test console</span>
  </header>

  <div class="status" id="status"><span>checking…</span></div>

  <div class="controls">
    <select id="lang" title="Reply language">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="kn">ಕನ್ನಡ</option>
    </select>
    <button class="icon" id="arm" type="button" aria-pressed="false"
            title="Speak answers aloud as they are written. Turn on before asking.">
      <span class="ico"></span><span class="lbl">Speak as it answers</span>
    </button>
    <button class="icon" id="reset" type="button" hidden
            title="Forget what has been asked so far and start a fresh thread.">
      <span class="lbl">New conversation</span>
    </button>
  </div>

  <form id="form">
    <input id="q" placeholder="Ask me anything about EatLabs…" autocomplete="off" required>
    <button class="icon mic" id="mic" type="button" aria-pressed="false" hidden
            title="Hold a question and speak it. Press again to stop.">
      <span class="ico"></span><span class="lbl">Speak</span>
    </button>
    <button class="primary" id="send" type="submit">Ask</button>
  </form>
  <div class="hint" id="hint" hidden></div>

  <div id="feed"><div class="empty">I am your EatLabs assistant. What is on your mind?</div></div>
</div>

<script>
const SPEAKER_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';
const STOP = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>';

const feed = document.getElementById('feed');
const form = document.getElementById('form');
const qEl = document.getElementById('q');
const sendEl = document.getElementById('send');
const langEl = document.getElementById('lang');
const armEl = document.getElementById('arm');
const micEl = document.getElementById('mic');
const hintEl = document.getElementById('hint');

let serverTts = false;
let serverStt = null;
let armed = false;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

armEl.querySelector('.ico').innerHTML = SPEAKER_OFF;
armEl.onclick = () => {
  armed = !armed;
  armEl.setAttribute('aria-pressed', String(armed));
  armEl.querySelector('.ico').innerHTML = armed ? SPEAKER_ON : SPEAKER_OFF;
  armEl.querySelector('.lbl').textContent = armed ? 'Speaking as it answers' : 'Speak as it answers';
  if (!armed) speech.stop();
};

fetch('/api/status').then((r) => r.json()).then((s) => {
  serverTts = s.tts === 'indic-parler';
  serverStt = s.stt;
  document.getElementById('status').innerHTML =
    `<span><span class="dot ${s.modelReachable ? 'live' : ''}"></span><b>${esc(s.model)}</b></span>` +
    `<span><b>${s.chunks}</b> chunks</span>` +
    `<span>speech out: <b>${serverTts ? 'Indic Parler-TTS' : 'browser voice'}</b></span>` +
    `<span>speech in: <b>${serverStt ? esc(serverStt) : 'off'}</b></span>`;
  // The microphone appears only when there is something behind it. A button that
  // fails after someone has spoken into it is worse than no button.
  micEl.hidden = !serverStt || !recorder.supported();
  if (serverStt && !recorder.supported()) {
    say(location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost'
      ? 'This browser will not record audio, so the microphone is hidden.'
      : 'Microphone needs https or localhost. Over a plain http address the browser blocks it.', true);
  }
}).catch(() => {
  document.getElementById('status').textContent = 'server not reachable';
});

function say(message, bad = false) {
  hintEl.hidden = !message;
  hintEl.textContent = message ?? '';
  hintEl.classList.toggle('bad', !!bad);
}

/**
 * One speech queue for the whole page, because two things feed it: sentences arriving
 * mid-answer while the speaker is armed, and a whole answer when its icon is pressed
 * afterwards. Both must never play over each other, so everything goes through here and
 * a new request stops whatever was running.
 *
 * Server speech is preferred: it is the voice the phone agent uses, and its normaliser
 * turns "35,000" into words correctly in all three languages. The browser voice is the
 * fallback so the page is useful with no GPU running - it cannot do that for Hindi or
 * Kannada, which is a limitation of the fallback, not of the agent.
 */
const speech = {
  queue: [],
  running: false,
  token: 0,            // bumped on stop, so an in-flight fetch knows it is stale
  current: null,
  onIdle: null,

  stop() {
    this.token++;
    this.queue = [];
    this.running = false;
    try { window.speechSynthesis.cancel(); } catch {}
    if (this.current instanceof HTMLAudioElement) { this.current.pause(); this.current = null; }
    const idle = this.onIdle;
    this.onIdle = null;
    if (idle) idle();
  },

  push(text, lang) {
    if (!text || !text.trim()) return;
    this.queue.push({ text: text.trim(), lang });
    if (!this.running) this.drain();
  },

  async drain() {
    this.running = true;
    const mine = this.token;
    while (this.queue.length) {
      const { text, lang } = this.queue.shift();
      try { await this.say(text, lang, mine); } catch { /* a failed sentence must not stall the rest */ }
      if (mine !== this.token) return;                     // stopped while we were speaking
    }
    this.running = false;
    if (mine === this.token && this.onIdle) { const idle = this.onIdle; this.onIdle = null; idle(); }
  },

  say(text, lang, mine) {
    return new Promise(async (resolve) => {
      if (serverTts) {
        try {
          const res = await fetch('/api/speak', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ text, lang }),
          });
          if (mine !== this.token) return resolve();
          if (res.ok) {
            const audio = new Audio(URL.createObjectURL(await res.blob()));
            if (mine !== this.token) return resolve();
            this.current = audio;
            audio.onended = audio.onerror = () => resolve();
            await audio.play();
            return;
          }
        } catch { /* fall through to the browser voice */ }
        if (mine !== this.token) return resolve();
      }

      if (!('speechSynthesis' in window)) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = { en: 'en-IN', hi: 'hi-IN', kn: 'kn-IN' }[lang] ?? 'en-IN';
      const voices = speechSynthesis.getVoices();
      const voice = voices.find((v) => v.lang === u.lang) || voices.find((v) => v.lang.startsWith(lang));
      if (voice) u.voice = voice;
      u.onend = u.onerror = () => resolve();
      speechSynthesis.speak(u);
    });
  },
};

/**
 * Speech in.
 *
 * Recorded as 16 kHz mono WAV rather than handed to MediaRecorder, which would be less
 * code. Two reasons, both about the thing on the other end:
 *
 *  - MediaRecorder gives whatever container the browser feels like. Chrome produces
 *    WebM/Opus, Safari produces MP4/AAC, and the list of formats a transcription
 *    endpoint accepts is not the same for any two of them. WAV is accepted by all of
 *    them, so the page does not have to know which one it is talking to.
 *  - 16 kHz mono is Whisper's native input. Sending anything else just means the server
 *    resamples it, and the upload is larger for no gain.
 *
 * The cost is size - about 32 KB a second, uncompressed. For a spoken question that is
 * well under a megabyte, and it never leaves the machine the server is on unless the
 * tunnel is up.
 */
const TARGET_RATE = 16000;
const MAX_SECONDS = 60;

/** Pulls every block of samples out of the audio thread and nothing else. */
const WORKLET = `
class Tap extends AudioWorkletProcessor {
  process(inputs) {
    const channel = inputs[0] && inputs[0][0];
    if (channel && channel.length) this.port.postMessage(new Float32Array(channel));
    return true;
  }
}
registerProcessor('tap', Tap);
`;

/** Box-filter decimation. Crude as resampling goes, and inaudible on speech. */
function downsample(samples, from, to) {
  if (from <= to) return samples;
  const ratio = from / to;
  const out = new Float32Array(Math.floor(samples.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(samples.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = start; j < end; j++) sum += samples[j];
    out[i] = sum / Math.max(1, end - start);
  }
  return out;
}

/** 16-bit PCM in a 44-byte canonical header. The whole of the WAV format we need. */
function toWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const ascii = (at, s) => { for (let i = 0; i < s.length; i++) view.setUint8(at + i, s.charCodeAt(i)); };
  ascii(0, 'RIFF');  view.setUint32(4, 36 + samples.length * 2, true);
  ascii(8, 'WAVE');  ascii(12, 'fmt ');
  view.setUint32(16, 16, true);          // PCM header length
  view.setUint16(20, 1, true);           // format 1 = uncompressed
  view.setUint16(22, 1, true);           // mono
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);    // byte rate
  view.setUint16(32, 2, true);           // block align
  view.setUint16(34, 16, true);          // bits per sample
  ascii(36, 'data'); view.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

const recorder = {
  ctx: null, stream: null, node: null, worklet: null,
  chunks: [], frames: 0, rate: 0, started: 0, timer: 0, level: 0,

  supported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.AudioWorkletNode);
  },

  get recording() { return !!this.ctx; },

  async start(onTick) {
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    this.ctx = new (window.AudioContext ?? window.webkitAudioContext)();
    this.rate = this.ctx.sampleRate;
    this.chunks = [];
    this.frames = 0;
    this.level = 0;

    this.worklet = this.worklet ?? URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
    await this.ctx.audioWorklet.addModule(this.worklet);

    this.node = new AudioWorkletNode(this.ctx, 'tap');
    this.node.port.onmessage = (e) => {
      const block = e.data;
      this.chunks.push(block);
      this.frames += block.length;
      let sum = 0;
      for (let i = 0; i < block.length; i++) sum += block[i] * block[i];
      // Smoothed, or the ring flickers at every syllable boundary and reads as noise.
      this.level = this.level * 0.75 + Math.min(1, Math.sqrt(sum / block.length) * 7) * 0.25;
    };

    // A worklet with no connected output is never pulled, so it is wired to a silent
    // gain node. Nothing is played back - this only keeps the graph running.
    const silent = this.ctx.createGain();
    silent.gain.value = 0;
    this.ctx.createMediaStreamSource(this.stream).connect(this.node);
    this.node.connect(silent).connect(this.ctx.destination);

    this.started = Date.now();
    this.timer = setInterval(() => onTick(Math.floor((Date.now() - this.started) / 1000), this.level), 100);
  },

  /** Everything recorded so far, as a WAV blob, and the microphone released. */
  async stop() {
    const { chunks, frames, rate } = this;
    this.teardown();
    if (!frames) return null;

    const joined = new Float32Array(frames);
    let at = 0;
    for (const block of chunks) { joined.set(block, at); at += block.length; }
    return toWav(downsample(joined, rate, TARGET_RATE), Math.min(rate, TARGET_RATE));
  },

  teardown() {
    clearInterval(this.timer);
    this.timer = 0;
    if (this.node) { this.node.port.onmessage = null; this.node.disconnect(); this.node = null; }
    // Releasing the tracks is what turns the browser's recording indicator off. Leaving
    // a page holding a live microphone is not acceptable, so this runs on every exit.
    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
    if (this.ctx) { this.ctx.close().catch(() => {}); this.ctx = null; }
    this.chunks = [];
    this.frames = 0;
  },
};

let micBusy = false;

function micState(state, label) {
  micEl.dataset.state = state;
  micEl.setAttribute('aria-pressed', String(state === 'recording'));
  micEl.querySelector('.ico').innerHTML = state === 'recording' ? STOP : MIC;
  micEl.querySelector('.lbl').textContent = label;
}
micState('idle', 'Speak');

micEl.onclick = async () => {
  if (micBusy) return;
  if (recorder.recording) return finishRecording();

  // An answer still being read aloud would be recorded along with the question.
  speech.stop();
  try {
    await recorder.start((seconds, level) => {
      micEl.style.setProperty('--level', level.toFixed(3));
      micEl.querySelector('.lbl').textContent = `${seconds}s · stop`;
      if (seconds >= MAX_SECONDS) finishRecording();
    });
  } catch (err) {
    recorder.teardown();
    say(err.name === 'NotAllowedError'
      ? 'The browser blocked the microphone. Allow it for this page, then try again.'
      : `Microphone failed: ${err.message}`, true);
    return;
  }
  micState('recording', '0s · stop');
  say('Listening — press again when you have finished.');
};

/**
 * Stop, transcribe, then ask. Two steps rather than one so the transcript is visible
 * before it is answered: ASR is wrong often enough that silently answering a misheard
 * question is the worse failure.
 */
async function finishRecording() {
  if (micBusy) return;
  micBusy = true;
  micState('working', 'Transcribing…');
  say('Transcribing…');

  try {
    const blob = await recorder.stop();
    if (!blob || blob.size < 2000) { say('Nothing was recorded.', true); return; }

    const res = await fetch(`/api/listen?lang=${encodeURIComponent(langEl.value)}`, {
      method: 'POST',
      headers: { 'content-type': 'audio/wav' },
      body: blob,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? `transcription failed (${res.status})`);
    if (!data.text) { say('I did not hear anything. Try again, a little closer to the microphone.', true); return; }

    qEl.value = data.text;
    pendingSource = 'voice';
    // After, not before: submitting clears the hint, and what was heard is worth
    // leaving on screen while the answer is being written.
    form.requestSubmit();
    say(`Heard in ${data.ms} ms — ask again if that is not what you said.`);
  } catch (err) {
    say(`Could not transcribe that: ${err.message}`, true);
  } finally {
    micBusy = false;
    micState('idle', 'Speak');
  }
}

// A page unloading mid-recording must not leave the microphone open.
window.addEventListener('pagehide', () => recorder.teardown());

/** The per-answer speaker icon: press after the answer is written to hear it read back. */
function wireReplay(button, getText, lang) {
  const idle = () => {
    button.classList.remove('busy');
    button.setAttribute('aria-pressed', 'false');
    button.querySelector('.ico').innerHTML = SPEAKER_ON;
    button.querySelector('.lbl').textContent = 'Speak';
  };
  const active = () => {
    button.classList.add('busy');
    button.setAttribute('aria-pressed', 'true');
    button.querySelector('.ico').innerHTML = STOP;
    button.querySelector('.lbl').textContent = 'Stop';
  };
  button.onclick = () => {
    if (button.getAttribute('aria-pressed') === 'true') { speech.stop(); return; }
    speech.stop();
    active();
    speech.onIdle = idle;
    speech.push(getText(), lang);
  };
  return { idle, active };
}

function card(question) {
  const el = document.createElement('div');
  el.className = 'turn';
  el.innerHTML = `
    <p class="q">${esc(question)}</p>
    <p class="a"><span class="pending">…</span></p>
    <div class="meta">
      <button class="icon speak" type="button" aria-pressed="false" title="Read this answer aloud">
        <span class="ico"></span><span class="lbl">Speak</span>
      </button>
      <span class="ms"></span>
    </div>
    <details class="psgs" hidden><summary></summary><div class="body"></div></details>`;
  el.querySelector('.speak .ico').innerHTML = SPEAKER_ON;
  if (feed.firstChild?.className === 'empty') feed.innerHTML = '';
  feed.prepend(el);
  return el;
}

/**
 * Which of the two routes answered, in a line. Only shown for the open route, because
 * grounded is the ordinary case and the passage list below already says so, and because
 * "the model answered this with no source" is the one thing a tester must not miss.
 */
function renderMode(el, mode) {
  if (mode !== 'open') return;
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent =
    'No passages — the knowledge base holds nothing on this, so the model answered on its own. '
    + 'On this route it is blocked from using any figure, and from stating anything as fact about EatLabs.';
  el.querySelector('.a').after(note);
}

function renderPassages(el, passages) {
  if (!passages.length) return;
  const details = el.querySelector('.psgs');
  details.hidden = false;
  details.querySelector('summary').textContent = `${passages.length} passages retrieved`;
  details.querySelector('.body').innerHTML = passages.map((p) => `
    <div class="psg">
      <div class="h">${esc(p.heading)}
        <span class="pill ${p.sensitivity === 'high' || p.sensitivity === 'critical' ? 'high' : ''}">${esc(p.sensitivity)}</span>
        ${p.provenance === 'provided' ? '<span class="pill provided">provided</span>' : ''}
        <span class="pill">${p.score}</span>
      </div>
      <div class="id">${esc(p.id)}</div>
    </div>`).join('') || '<p>none</p>';
}

function renderBlocked(el, data) {
  const flag = document.createElement('div');
  flag.className = 'flag';
  flag.innerHTML = `<b>Answer blocked — ${esc(data.rejected)}</b>
    The reply above is the safe fallback, not the model's.
    ${data.rejectedText ? `<span class="said">It wanted to say: “${esc(data.rejectedText)}”</span>` : ''}`;
  el.querySelector('.a').after(flag);
}

/**
 * The thread this tab is in. Issued by the server on the first question and echoed back
 * on every one after it, so "is that with GST?" knows what "that" was. The page never
 * sends the transcript itself - the server keeps that, and the reason is in
 * src/conversation.ts. Null until the first answer comes back.
 */
let conversationId = null;

/**
 * The button only means anything once there is something to forget, so it stays hidden
 * until the first answer. Shown, it is also the only indication the console gives that
 * the agent is carrying a thread at all.
 */
function showReset() {
  document.getElementById('reset').hidden = false;
}

document.getElementById('reset').addEventListener('click', async () => {
  try {
    const res = await fetch('/api/conversation/reset', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ conversationId }),
    });
    const data = await res.json();
    conversationId = data.conversationId ?? null;
  } catch {
    // The server is the only copy, so a failed reset must not leave the page believing
    // it started fresh - keep the id and let the next question carry on as before.
    return;
  }
  document.getElementById('feed').innerHTML =
    '<div class="empty">Starting again. What would you like to know?</div>';
  document.getElementById('reset').hidden = true;
});

/** Streaming path: used when the speaker was armed before the question was asked. */
async function askStreaming(question, lang, el, source = 'text') {
  const answer = el.querySelector('.a');
  answer.innerHTML = '';
  let text = '';

  const res = await fetch('/api/ask/stream', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ question, lang, source, conversationId }),
  });
  if (!res.ok || !res.body) throw new Error(`stream failed (${res.status})`);

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const frames = buffer.split('\n\n');
    buffer = frames.pop() ?? '';
    for (const frame of frames) {
      const line = frame.split('\n').find((l) => l.startsWith('data:'));
      if (!line) continue;
      const event = JSON.parse(line.slice(5).trim());

      if (event.type === 'conversation') {
        conversationId = event.conversationId;
        showReset();
      } else if (event.type === 'passages') {
        renderPassages(el, event.passages);
        renderMode(el, event.mode);
      } else if (event.type === 'sentence') {
        // Every sentence on this stream has already cleared the server-side gate.
        const span = document.createElement('span');
        span.className = 'sent';
        span.textContent = (text ? ' ' : '') + event.text;
        answer.append(span);
        text += (text ? ' ' : '') + event.text;
        speech.push(event.text, lang);
      } else if (event.type === 'done') {
        el.querySelector('.ms').textContent = `${event.ms} ms`;
        text = event.text;
      } else if (event.type === 'blocked') {
        speech.stop();
        answer.textContent = event.text;
        text = event.text;
        el.querySelector('.ms').textContent = `${event.ms} ms`;
        renderBlocked(el, event);
        speech.push(event.text, lang);
      }
    }
  }
  if (!text) answer.textContent = '(nothing came back)';
  return text;
}

/** Non-streaming path: the answer is written, then spoken only if its icon is pressed. */
async function askWhole(question, lang, el, source = 'text') {
  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ question, lang, source, conversationId }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error ?? 'failed');

  if (data.conversationId) { conversationId = data.conversationId; showReset(); }
  el.querySelector('.a').textContent = data.text;
  el.querySelector('.ms').textContent = `${data.ms} ms`;
  renderPassages(el, data.passages);
  renderMode(el, data.mode);
  if (data.rejected) renderBlocked(el, data);
  return data.text;
}

/**
  * Set by the microphone just before it submits, and cleared on the next submit either
  * way. The server treats a transcript differently from typed text - an ASR can produce
  * fluent nonsense from silence, a keyboard cannot - so it has to be told which it is.
  */
let pendingSource = 'text';

form.onsubmit = async (e) => {
  e.preventDefault();
  const question = qEl.value.trim();
  if (!question) return;
  const source = pendingSource;
  pendingSource = 'text';
  speech.stop();
  say('');
  sendEl.disabled = true;
  micEl.disabled = true;
  sendEl.textContent = '…';
  const lang = langEl.value;
  const el = card(question);
  qEl.value = '';

  let text = '';
  try {
    text = armed ? await askStreaming(question, lang, el, source) : await askWhole(question, lang, el, source);
  } catch (err) {
    el.querySelector('.a').textContent = '';
    renderBlocked(el, { rejected: 'request failed', rejectedText: err.message });
  } finally {
    sendEl.disabled = false;
    micEl.disabled = false;
    sendEl.textContent = 'Ask';
  }

  const button = el.querySelector('.speak');
  const state = wireReplay(button, () => text, lang);
  // While armed the queue is already working through this answer; show that on its icon.
  if (armed && speech.running) {
    state.active();
    speech.onIdle = state.idle;
  }
};

// Chrome populates voices asynchronously; without this the first utterance uses the wrong one.
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
</body>
</html>
